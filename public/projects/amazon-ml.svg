<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="amz_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#amz_bg)"/>
  
  <rect x="30" y="25" width="540" height="290" rx="12" fill="#0b1329" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="55" cy="45" r="4" fill="#ef4444"/>
  <circle cx="70" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="4" fill="#10b981"/>
  <text x="110" y="49" fill="#fde68a" font-size="9" font-family="monospace">github.com/aditi-malviya666/amazon-ml</text>

  <!-- Amazon ML Header -->
  <text x="50" y="90" fill="#fde68a" font-size="14" font-family="sans-serif" font-weight="bold">Amazon ML Challenge • Multimodal Extraction Pipeline</text>
  <text x="50" y="110" fill="#cbd5e1" font-size="10" font-family="sans-serif">OCR + Multimodal Transformer for E-Commerce Product Entity Extraction</text>

  <!-- Visual Pipeline Boxes -->
  <rect x="50" y="130" width="150" height="155" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="155" fill="#f59e0b" font-size="10" font-family="sans-serif" font-weight="bold">Input Image &amp; Text</text>
  <!-- Mock product box -->
  <rect x="65" y="170" width="120" height="80" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="3 3"/>
  <circle cx="125" cy="210" r="20" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="85" y="215" fill="#fde68a" font-size="9" font-family="sans-serif">250ml Bottle</text>
  <text x="75" y="270" fill="#94a3b8" font-size="8" font-family="sans-serif">OCR Text Detection</text>

  <!-- Arrow -->
  <text x="215" y="215" fill="#f59e0b" font-size="16">→</text>

  <!-- Feature Extraction Model -->
  <rect x="240" y="130" width="140" height="155" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="250" y="155" fill="#38bdf8" font-size="10" font-family="sans-serif font-weight-bold">Dual Stream Model</text>
  <rect x="250" y="170" width="120" height="30" rx="4" fill="#0284c7"/>
  <text x="260" y="188" fill="#ffffff" font-size="8" font-family="sans-serif">Vision Transformer (ViT)</text>
  <rect x="250" y="210" width="120" height="30" rx="4" fill="#0284c7"/>
  <text x="260" y="228" fill="#ffffff" font-size="8" font-family="sans-serif">BERT Text Adapter</text>
  <text x="260" y="265" fill="#7dd3fc" font-size="8" font-family="sans-serif">Cross-Attention Head</text>

  <!-- Arrow -->
  <text x="395" y="215" fill="#f59e0b" font-size="16">→</text>

  <!-- Results Output -->
  <rect x="420" y="130" width="130" height="155" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="430" y="155" fill="#10b981" font-size="10" font-family="sans-serif font-weight-bold">Extracted Entities</text>
  <rect x="430" y="170" width="110" height="24" rx="4" fill="#064e3b"/>
  <text x="440" y="186" fill="#86efac" font-size="8" font-family="sans-serif">Weight: 250 g</text>
  <rect x="430" y="200" width="110" height="24" rx="4" fill="#064e3b"/>
  <text x="440" y="216" fill="#86efac" font-size="8" font-family="sans-serif">Volume: 250 ml</text>
  <rect x="430" y="230" width="110" height="24" rx="4" fill="#064e3b"/>
  <text x="440" y="246" fill="#86efac" font-size="8" font-family="sans-serif">F1 Score: High</text>
</svg>
