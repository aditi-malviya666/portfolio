<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  
  <!-- Floor plan grid -->
  <rect x="20" y="20" width="300" height="300" rx="8" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Floor plan walls -->
  <!-- Outer walls -->
  <rect x="30" y="30" width="280" height="280" rx="4" fill="none" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2"/>
  
  <!-- Interior rooms -->
  <line x1="30" y1="130" x2="175" y2="130" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="175" y1="30" x2="175" y2="175" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="175" y1="175" x2="310" y2="175" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="30" y1="220" x2="175" y2="220" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Doors (gaps in walls) -->
  <rect x="100" y="128" width="20" height="4" fill="#0f172a"/>
  <rect x="173" y="80" width="4" height="20" fill="#0f172a"/>
  <rect x="173" y="230" width="4" height="20" fill="#0f172a"/>

  <!-- BLE Beacons -->
  <circle cx="50" cy="50" r="8" fill="#6366f1" opacity="0.9"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="40" y="82" fill="#a5b4fc" font-size="6" font-family="monospace">BLE-01</text>

  <circle cx="295" cy="50" r="8" fill="#06b6d4" opacity="0.9"/>
  <circle cx="295" cy="50" r="16" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="295" cy="50" r="24" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="280" y="82" fill="#67e8f9" font-size="6" font-family="monospace">BLE-02</text>

  <circle cx="50" cy="295" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="50" cy="295" r="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="40" y="275" fill="#fcd34d" font-size="6" font-family="monospace">BLE-03</text>

  <circle cx="295" cy="295" r="8" fill="#10b981" opacity="0.9"/>
  <circle cx="295" cy="295" r="16" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="278" y="275" fill="#6ee7b7" font-size="6" font-family="monospace">BLE-04</text>

  <!-- Navigation path with arrows -->
  <path d="M80,250 L80,160 L140,160 L140,80 L200,80 L200,120 L240,120" 
    fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="6,3"/>
  
  <!-- Path waypoints -->
  <circle cx="80" cy="250" r="5" fill="#818cf8"/>
  <circle cx="80" cy="160" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="140" cy="160" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="200" cy="80" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="240" cy="120" r="6" fill="#f59e0b"/>
  <text x="248" y="124" fill="#fcd34d" font-size="7" font-family="monospace">DEST</text>

  <!-- User position indicator -->
  <circle cx="80" cy="250" r="12" fill="#6366f1" opacity="0.2"/>
  <circle cx="80" cy="250" r="7" fill="#818cf8"/>
  <text x="62" y="268" fill="#a5b4fc" font-size="6" font-family="monospace">YOU</text>

  <!-- AR arrow overlay -->
  <polygon points="240,112 232,120 240,128 262,120" fill="#f59e0b" opacity="0.9"/>
  <text x="232" y="140" fill="#fcd34d" font-size="6" font-family="monospace">→ 24m</text>

  <!-- Right panel: System info -->
  <rect x="335" y="20" width="245" height="300" rx="12" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.3"/>

  <text x="355" y="48" fill="#818cf8" font-size="13" font-family="sans-serif" font-weight="700">🗺 Indoor Navigation</text>
  <text x="355" y="64" fill="#a5b4fc" font-size="9" font-family="sans-serif">SIH Finalist • BLE + AR Wayfinding</text>

  <!-- Position data -->
  <rect x="348" y="78" width="220" height="55" rx="8" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.2"/>
  <text x="362" y="96" fill="#94a3b8" font-size="7" font-family="monospace">CURRENT POSITION</text>
  <text x="362" y="112" fill="#818cf8" font-size="11" font-family="monospace" font-weight="700">Floor 2 · Zone B</text>
  <text x="362" y="125" fill="#6ee7b7" font-size="9" font-family="monospace">±0.8m accuracy (Kalman)</text>

  <!-- BLE signal bars -->
  <rect x="348" y="140" width="220" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.2"/>
  <text x="362" y="158" fill="#94a3b8" font-size="7" font-family="monospace">BLE TRILATERATION RSSI</text>
  <rect x="362" y="162" width="40" height="8" rx="2" fill="#6366f1" opacity="0.9"/>
  <text x="406" y="170" fill="#a5b4fc" font-size="6" font-family="monospace">BLE-01: -65dBm</text>
  <rect x="362" y="174" width="28" height="8" rx="2" fill="#06b6d4" opacity="0.9"/>
  <text x="394" y="182" fill="#67e8f9" font-size="6" font-family="monospace">BLE-02: -72dBm</text>

  <!-- Route info -->
  <rect x="348" y="198" width="220" height="55" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.2"/>
  <text x="362" y="216" fill="#94a3b8" font-size="7" font-family="monospace">A* ROUTE PLANNING</text>
  <text x="362" y="230" fill="#f0fdf4" font-size="9" font-family="sans-serif">Turn right → 24m → Elevator</text>
  <text x="362" y="244" fill="#94a3b8" font-size="8" font-family="monospace">ETA: ~2 min · 4 waypoints</text>
  <circle cx="525" cy="225" r="12" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="521" y="229" fill="#fcd34d" font-size="10">↗</text>

  <!-- Metrics -->
  <rect x="348" y="262" width="220" height="48" rx="8" fill="#14532d" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="372" y="282" fill="#f0fdf4" font-size="13" font-family="monospace" font-weight="700">&lt;0.8m</text>
  <text x="362" y="298" fill="#86efac" font-size="7" font-family="sans-serif">Position Error</text>
  <line x1="425" y1="268" x2="425" y2="305" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="440" y="282" fill="#f0fdf4" font-size="13" font-family="monospace" font-weight="700">60fps</text>
  <text x="434" y="298" fill="#86efac" font-size="7" font-family="sans-serif">AR HUD Render</text>
  <line x1="508" y1="268" x2="508" y2="305" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="516" y="282" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">SIH</text>
  <text x="512" y="298" fill="#fde68a" font-size="7" font-family="sans-serif">Finalist</text>
</svg>