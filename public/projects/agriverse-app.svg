<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  
  <!-- Phone mockup (left) -->
  <rect x="30" y="20" width="160" height="300" rx="22" fill="#1e293b" stroke="#16a34a" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="38" y="30" width="144" height="280" rx="16" fill="#0f172a"/>
  <!-- Notch -->
  <rect x="80" y="28" width="60" height="8" rx="4" fill="#1e293b"/>
  
  <!-- Camera overlay view -->
  <rect x="38" y="50" width="144" height="140" rx="4" fill="#1a2e1a"/>
  <!-- Camera viewfinder grid -->
  <line x1="86" y1="50" x2="86" y2="190" stroke="#16a34a" stroke-opacity="0.3" stroke-width="0.8"/>
  <line x1="134" y1="50" x2="134" y2="190" stroke="#16a34a" stroke-opacity="0.3" stroke-width="0.8"/>
  <line x1="38" y1="97" x2="182" y2="97" stroke="#16a34a" stroke-opacity="0.3" stroke-width="0.8"/>
  <line x1="38" y1="143" x2="182" y2="143" stroke="#16a34a" stroke-opacity="0.3" stroke-width="0.8"/>
  
  <!-- Leaf in camera view -->
  <ellipse cx="110" cy="118" rx="45" ry="35" fill="#15803d" opacity="0.9" transform="rotate(-20 110 118)"/>
  <line x1="90" y1="140" x2="130" y2="98" stroke="#166534" stroke-width="2.5"/>
  <!-- Disease spots on leaf -->
  <circle cx="102" cy="108" r="6" fill="#b45309" opacity="0.8"/>
  <circle cx="118" cy="125" r="4" fill="#92400e" opacity="0.8"/>
  
  <!-- Bounding box around disease -->
  <rect x="95" y="100" width="30" height="22" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="97" y="136" fill="#ef4444" font-size="6" font-family="monospace">BLAST 98%</text>
  
  <!-- AI processing indicator -->
  <rect x="38" y="195" width="144" height="28" rx="4" fill="#0f172a"/>
  <circle cx="58" cy="209" r="6" fill="#16a34a"/>
  <text x="70" y="213" fill="#6ee7b7" font-size="8" font-family="sans-serif" font-weight="600">Analyzing...</text>
  <text x="145" y="213" fill="#34d399" font-size="8" font-family="monospace">48ms</text>
  
  <!-- Voice guidance icon -->
  <rect x="38" y="230" width="144" height="22" rx="4" fill="#1e293b"/>
  <text x="50" y="244" fill="#86efac" font-size="8" font-family="sans-serif">🔊 Blast disease detected. Apply...</text>
  
  <!-- Treatment recommendation -->
  <rect x="38" y="258" width="144" height="38" rx="4" fill="#14532d" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="48" y="272" fill="#f0fdf4" font-size="8" font-family="sans-serif" font-weight="600">💊 Treatment Plan</text>
  <text x="48" y="285" fill="#86efac" font-size="7" font-family="sans-serif">Copper-based fungicide spray</text>

  <!-- Right: Feature overview cards -->
  <text x="210" y="40" fill="#4ade80" font-size="15" font-family="sans-serif" font-weight="700">AgriVerse Mobile App</text>
  <text x="210" y="58" fill="#86efac" font-size="10" font-family="sans-serif">On-device AI · Offline First · 5+ Languages</text>

  <!-- Feature cards grid -->
  <rect x="210" y="70" width="175" height="62" rx="10" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="225" y="92" fill="#4ade80" font-size="11" font-family="sans-serif" font-weight="600">📱 Offline-First</text>
  <text x="225" y="108" fill="#86efac" font-size="8" font-family="sans-serif">TFLite quantized model</text>
  <text x="225" y="122" fill="#86efac" font-size="8" font-family="sans-serif">32ms on-device inference</text>
  
  <rect x="395" y="70" width="175" height="62" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="410" y="92" fill="#fbbf24" font-size="11" font-family="sans-serif" font-weight="600">🗣️ Voice-First</text>
  <text x="410" y="108" fill="#fde68a" font-size="8" font-family="sans-serif">Multi-lingual audio guidance</text>
  <text x="410" y="122" fill="#fde68a" font-size="8" font-family="sans-serif">5+ regional dialects</text>

  <rect x="210" y="142" width="175" height="62" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="225" y="164" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="600">🤝 Federated Sync</text>
  <text x="225" y="180" fill="#93c5fd" font-size="8" font-family="sans-serif">Gradient upload when</text>
  <text x="225" y="194" fill="#93c5fd" font-size="8" font-family="sans-serif">connectivity restored</text>

  <rect x="395" y="142" width="175" height="62" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.3"/>
  <text x="410" y="164" fill="#a78bfa" font-size="11" font-family="sans-serif" font-weight="600">🎯 High Accuracy</text>
  <text x="410" y="180" fill="#c4b5fd" font-size="8" font-family="sans-serif">MobileNetV3 backbone</text>
  <text x="410" y="194" fill="#c4b5fd" font-size="8" font-family="sans-serif">98.7% crop diagnosis</text>

  <!-- Tech Stack -->
  <rect x="210" y="216" width="360" height="50" rx="10" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.2"/>
  <text x="225" y="233" fill="#94a3b8" font-size="8" font-family="monospace">TECH STACK</text>
  <rect x="225" y="238" width="62" height="18" rx="4" fill="#1e293b"/>
  <text x="234" y="251" fill="#38bdf8" font-size="7" font-family="monospace">React Native</text>
  <rect x="295" y="238" width="52" height="18" rx="4" fill="#1e293b"/>
  <text x="303" y="251" fill="#f472b6" font-size="7" font-family="monospace">TypeScript</text>
  <rect x="355" y="238" width="40" height="18" rx="4" fill="#1e293b"/>
  <text x="362" y="251" fill="#fbbf24" font-size="7" font-family="monospace">TFLite</text>
  <rect x="403" y="238" width="62" height="18" rx="4" fill="#1e293b"/>
  <text x="411" y="251" fill="#4ade80" font-size="7" font-family="monospace">FedAvg Sync</text>

  <!-- Metrics bar -->
  <rect x="210" y="278" width="360" height="50" rx="10" fill="#14532d" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="240" y="300" fill="#f0fdf4" font-size="16" font-family="monospace" font-weight="700">100%</text>
  <text x="225" y="316" fill="#86efac" font-size="8" font-family="sans-serif">Offline Ready</text>
  <line x1="300" y1="284" x2="300" y2="322" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="316" y="300" fill="#f0fdf4" font-size="16" font-family="monospace" font-weight="700">&lt;15MB</text>
  <text x="310" y="316" fill="#86efac" font-size="8" font-family="sans-serif">App Package</text>
  <line x1="400" y1="284" x2="400" y2="322" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="420" y="300" fill="#f0fdf4" font-size="16" font-family="monospace" font-weight="700">5+</text>
  <text x="406" y="316" fill="#86efac" font-size="8" font-family="sans-serif">Languages Supported</text>
  <line x1="490" y1="284" x2="490" y2="322" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="504" y="300" fill="#f0fdf4" font-size="16" font-family="monospace" font-weight="700">32ms</text>
  <text x="496" y="316" fill="#86efac" font-size="8" font-family="sans-serif">Inference</text>
</svg>