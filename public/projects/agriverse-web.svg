<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="url(#sky)"/>

  <!-- Sky gradient bg -->
  <rect width="600" height="180" fill="#022c22"/>
  <rect y="180" width="600" height="160" fill="#166534"/>

  <!-- Sun / sky glow -->
  <circle cx="510" cy="60" r="45" fill="url(#sun)" opacity="0.6"/>
  <circle cx="510" cy="60" r="30" fill="#fde047" opacity="0.8"/>

  <!-- Mountains / hills in background -->
  <polygon points="0,180 80,100 160,180" fill="#15803d" opacity="0.5"/>
  <polygon points="100,180 200,90 300,180" fill="#166534" opacity="0.6"/>
  <polygon points="300,180 400,110 500,180" fill="#14532d" opacity="0.5"/>

  <!-- Farm land rows -->
  <rect x="0" y="210" width="600" height="12" rx="2" fill="#166534" opacity="0.8"/>
  <rect x="0" y="230" width="600" height="12" rx="2" fill="#15803d" opacity="0.8"/>
  <rect x="0" y="250" width="600" height="12" rx="2" fill="#166534" opacity="0.8"/>
  <rect x="0" y="270" width="600" height="12" rx="2" fill="#16a34a" opacity="0.7"/>

  <!-- Farmer figure (left) -->
  <!-- Hat -->
  <ellipse cx="90" cy="150" rx="22" ry="8" fill="#78350f"/>
  <rect x="78" y="140" width="24" height="12" rx="4" fill="#92400e"/>
  <!-- Head -->
  <circle cx="90" cy="135" r="12" fill="#fcd34d"/>
  <!-- Eyes + smile -->
  <circle cx="86" cy="133" r="1.8" fill="#78350f"/>
  <circle cx="94" cy="133" r="1.8" fill="#78350f"/>
  <path d="M86,138 Q90,141 94,138" fill="none" stroke="#78350f" stroke-width="1.2"/>
  <!-- Body -->
  <rect x="80" y="147" width="20" height="28" rx="4" fill="#2563eb"/>
  <!-- Arms -->
  <line x1="80" y1="155" x2="62" y2="168" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="155" x2="118" y2="168" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="85" y1="175" x2="80" y2="195" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="95" y1="175" x2="100" y2="195" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <!-- Tool (hoe) -->
  <line x1="118" y1="168" x2="130" y2="200" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <rect x="122" y="166" width="16" height="6" rx="2" fill="#78350f"/>

  <!-- Plant / crops with disease indicator -->
  <!-- Healthy plants center -->
  <g opacity="0.9">
    <!-- Plant 1 - healthy -->
    <line x1="200" y1="210" x2="200" y2="175" stroke="#15803d" stroke-width="3"/>
    <ellipse cx="200" cy="168" rx="14" ry="20" fill="url(#leaf)" transform="rotate(-20 200 168)"/>
    <ellipse cx="200" cy="168" rx="12" ry="18" fill="#16a34a" transform="rotate(15 200 168)"/>
    
    <!-- Plant 2 - diseased (brown/yellow patches) -->
    <line x1="250" y1="210" x2="250" y2="172" stroke="#92400e" stroke-width="3"/>
    <ellipse cx="250" cy="165" rx="14" ry="19" fill="#854d0e" transform="rotate(-10 250 165)"/>
    <circle cx="244" cy="162" r="4" fill="#b45309" opacity="0.8"/>
    <circle cx="256" cy="168" r="3" fill="#b45309" opacity="0.8"/>
    <circle cx="250" cy="158" r="3" fill="#78350f" opacity="0.9"/>
    
    <!-- Plant 3 - healthy -->
    <line x1="300" y1="210" x2="300" y2="176" stroke="#15803d" stroke-width="3"/>
    <ellipse cx="300" cy="169" rx="13" ry="18" fill="url(#leaf)" transform="rotate(10 300 169)"/>
    
    <!-- Plant 4 - mild disease -->
    <line x1="350" y1="210" x2="350" y2="174" stroke="#a16207" stroke-width="3"/>
    <ellipse cx="350" cy="167" rx="13" ry="18" fill="#16a34a" transform="rotate(-15 350 167)"/>
    <circle cx="345" cy="162" r="3" fill="#b45309" opacity="0.6"/>
    <circle cx="355" cy="170" r="2.5" fill="#b45309" opacity="0.6"/>
  </g>

  <!-- AI Analysis overlay -->
  <rect x="380" y="100" width="200" height="225" rx="12" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="380" y="100" width="200" height="30" rx="12" fill="#16a34a" fill-opacity="0.2"/>
  <text x="395" y="120" fill="#4ade80" font-size="10" font-family="sans-serif" font-weight="700">AI Diagnosis — AgriVerse</text>

  <!-- Disease detection UI -->
  <rect x="390" y="138" width="80" height="80" rx="6" fill="#1e293b" stroke="#16a34a" stroke-opacity="0.3"/>
  <!-- Heatmap overlay simulation -->
  <rect x="390" y="138" width="80" height="80" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <circle cx="410" cy="158" r="8" fill="#ef4444" fill-opacity="0.4"/>
  <circle cx="430" cy="168" r="6" fill="#f59e0b" fill-opacity="0.4"/>
  <circle cx="450" cy="155" r="4" fill="#ef4444" fill-opacity="0.3"/>
  <text x="395" y="230" fill="#94a3b8" font-size="8" font-family="monospace">Lesion Heatmap</text>

  <!-- Diagnosis result -->
  <rect x="478" y="138" width="92" height="80" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="486" y="155" fill="#f59e0b" font-size="8" font-family="sans-serif" font-weight="600">Blast Disease</text>
  <text x="486" y="168" fill="#6ee7b7" font-size="7" font-family="monospace">Confidence:</text>
  <text x="486" y="180" fill="#34d399" font-size="13" font-family="monospace" font-weight="700">98.7%</text>
  <text x="486" y="195" fill="#94a3b8" font-size="7" font-family="monospace">MobileNetV3</text>
  <text x="486" y="207" fill="#94a3b8" font-size="7" font-family="monospace">FedAvg Local</text>

  <!-- Feature metrics -->
  <rect x="390" y="246" width="68" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.2"/>
  <text x="398" y="260" fill="#94a3b8" font-size="7" font-family="monospace">Privacy</text>
  <text x="398" y="274" fill="#38bdf8" font-size="13" font-weight="700" font-family="monospace">100%</text>
  <text x="398" y="286" fill="#94a3b8" font-size="7" font-family="monospace">Data Local</text>

  <rect x="464" y="246" width="106" height="48" rx="6" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.2"/>
  <text x="474" y="260" fill="#94a3b8" font-size="7" font-family="monospace">Federated Nodes</text>
  <text x="474" y="274" fill="#4ade80" font-size="13" font-weight="700" font-family="monospace">FedAvg</text>
  <text x="474" y="286" fill="#94a3b8" font-size="7" font-family="monospace">48ms inference</text>

  <!-- Label band at top -->
  <rect x="0" y="0" width="600" height="28" fill="#166534" fill-opacity="0.9"/>
  <text x="20" y="18" fill="#86efac" font-size="11" font-family="sans-serif" font-weight="600">🌾 AgriVerse — Farm Disease Detection Platform</text>
  <text x="460" y="18" fill="#4ade80" font-size="9" font-family="monospace">Federated ML</text>
</svg>