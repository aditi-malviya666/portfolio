<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cpu_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#cpu_bg)"/>
  
  <rect x="30" y="25" width="540" height="290" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="55" cy="45" r="4" fill="#ef4444"/>
  <circle cx="70" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="4" fill="#10b981"/>
  <text x="110" y="49" fill="#a1a1aa" font-size="9" font-family="monospace">https://cpuscheduler-one.vercel.app</text>

  <!-- CPU Scheduler Workspace Header -->
  <rect x="50" y="70" width="500" height="35" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="65" y="92" fill="#f43f5e" font-size="12" font-family="sans-serif" font-weight="bold">CPU Scheduler Pro • Interactive OS Simulator</text>
  <rect x="420" y="77" width="115" height="20" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
  <text x="430" y="91" fill="#fb7185" font-size="9" font-family="monospace">Round Robin (q=2)</text>

  <!-- Gantt Chart Timeline -->
  <rect x="50" y="120" width="500" height="75" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="65" y="140" fill="#e4e4e7" font-size="10" font-family="sans-serif" font-weight="bold">Interactive Gantt Chart</text>
  
  <!-- Process timeline bars -->
  <rect x="65" y="150" width="90" height="28" rx="4" fill="#3b82f6"/>
  <text x="100" y="168" fill="#ffffff" font-size="10" font-family="sans-serif font-weight-bold">P1</text>
  <rect x="160" y="150" width="70" height="28" rx="4" fill="#10b981"/>
  <text x="185" y="168" fill="#ffffff" font-size="10" font-family="sans-serif font-weight-bold">P2</text>
  <rect x="235" y="150" width="110" height="28" rx="4" fill="#f59e0b"/>
  <text x="280" y="168" fill="#ffffff" font-size="10" font-family="sans-serif font-weight-bold">P3</text>
  <rect x="350" y="150" width="80" height="28" rx="4" fill="#ec4899"/>
  <text x="380" y="168" fill="#ffffff" font-size="10" font-family="sans-serif font-weight-bold">P4</text>
  <rect x="435" y="150" width="90" height="28" rx="4" fill="#8b5cf6"/>
  <text x="470" y="168" fill="#ffffff" font-size="10" font-family="sans-serif font-weight-bold">P1</text>

  <!-- Metrics row -->
  <rect x="50" y="210" width="500" height="85" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="65" y="235" fill="#a1a1aa" font-size="10" font-family="sans-serif">Average Waiting Time: <strong fill="#10b981">4.2 ms</strong></text>
  <text x="240" y="235" fill="#a1a1aa" font-size="10" font-family="sans-serif">Avg Turnaround Time: <strong fill="#3b82f6">7.8 ms</strong></text>
  <text x="420" y="235" fill="#a1a1aa" font-size="10" font-family="sans-serif">CPU Utilization: <strong fill="#f59e0b">94.6%</strong></text>
  <rect x="65" y="255" width="470" height="24" rx="4" fill="#27272a"/>
  <text x="170" y="271" fill="#e4e4e7" font-size="10" font-family="sans-serif">Supported: FCFS • SJF (Preemptive/Non) • Priority • Round Robin</text>
</svg>
